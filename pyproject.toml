[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lieferschein-suche"
version = "1.0.0"
description = "Lokale PDF- und OCR-Suche fuer Lieferscheine"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6==6.8.3",
  "PyMuPDF==1.26.6",
  "Pillow==12.3.0",
  "watchdog==6.0.0",
]

[project.scripts]
lieferschein-suche = "lieferschein_suche.__main__:main"

[tool.setuptools.packages.find]
include = ["lieferschein_suche*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

